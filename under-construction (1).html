<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Construction</title>
<style>
  :root{
    --bg:#0b0d10;
    --bg-panel:#12151a;
    --lime:#c6ff3d;
    --lime-dim:#7a9c2a;
    --text:#e8ebee;
    --text-dim:#7d8794;
    --line:#232830;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Consolas','SF Mono','Courier New',monospace;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow:hidden;
    position:relative;
  }

  /* faint scanline / grid backdrop */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:48px 48px;
    opacity:0.25;
    pointer-events:none;
  }

  .queue-card{
    position:relative;
    width:100%;
    max-width:560px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:48px 40px 40px;
    text-align:center;
  }

  .queue-card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--lime), transparent);
    animation:scan 2.4s linear infinite;
  }

  @keyframes scan{
    0%{ transform:translateX(-100%); }
    100%{ transform:translateX(100%); }
  }

  .status-line{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--lime);
    margin-bottom:28px;
  }

  .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--lime);
    animation:pulse 1.3s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ opacity:1; box-shadow:0 0 0 0 rgba(198,255,61,0.5); }
    50%{ opacity:0.4; box-shadow:0 0 0 6px rgba(198,255,61,0); }
  }

  h1{
    font-size:clamp(28px, 6vw, 40px);
    letter-spacing:-0.01em;
    line-height:1.15;
    margin-bottom:16px;
  }

  h1 span{
    color:var(--lime);
  }

  p.sub{
    color:var(--text-dim);
    font-size:14px;
    line-height:1.6;
    max-width:400px;
    margin:0 auto 36px;
  }

  .queue-bar-wrap{
    text-align:left;
    margin-bottom:8px;
  }

  .queue-bar-label{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:8px;
  }

  .queue-bar-label b{
    color:var(--lime);
    font-weight:600;
  }

  .queue-bar{
    height:6px;
    width:100%;
    background:#1c2027;
    border-radius:3px;
    overflow:hidden;
    position:relative;
  }

  .queue-bar-fill{
    position:absolute;
    top:0; left:0; bottom:0;
    width:37%;
    background:var(--lime);
    border-radius:3px;
    animation:fill 3.6s ease-in-out infinite;
  }

  @keyframes fill{
    0%{ width:12%; }
    50%{ width:68%; }
    100%{ width:12%; }
  }

  .footer-note{
    margin-top:40px;
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:0.04em;
  }

  .footer-note b{
    color:var(--text);
  }

  @media (prefers-reduced-motion: reduce){
    .status-line .dot, .queue-card::before, .queue-bar-fill{
      animation:none;
    }
  }
</style>
</head>
<body>

  <div class="queue-card">
    <div class="status-line">
      <span class="dot"></span>
      Matchmaking in progress
    </div>

    <h1>You're in <span>queue</span><br>for the new site.</h1>

    <p class="sub">
      We're building something worth the wait. Hang tight, the page you're
      looking for is still loading in.
    </p>

    <div class="queue-bar-wrap">
      <div class="queue-bar-label">
        <span>Estimated wait</span>
        <b>Soon&trade;</b>
      </div>
      <div class="queue-bar">
        <div class="queue-bar-fill"></div>
      </div>
    </div>

    <div class="footer-note">
      <b>Status:</b> Under Construction
    </div>
  </div>

</body>
</html>
